name: Monthly 11-Flagship Open Data Refresh (495,000+ U.S. Institutions)

on:
  schedule:
    # Run at 09:00 UTC on the 5th of every month
    - cron: "0 9 5 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-flagships:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install openpyxl for EIA-861 Excel archives
        run: pip install --quiet openpyxl

      - name: Run 5-dataset CMS nursing home pipeline (14,686 homes)
        run: python data/nursing-homes/analyze_cms_nursing_homes.py --export-csv cms-nursing-homes-linked.csv.gz

      - name: Run 4-dataset CMS hospital pipeline (5,435 hospitals)
        run: python data/hospitals/analyze_cms_hospitals.py --export-csv cms-hospitals-linked.csv.gz

      - name: Run CMS dialysis clinic pipeline (7,471 clinics)
        run: python data/dialysis/analyze_cms_dialysis.py --export-csv cms-dialysis-clinics-linked.csv.gz

      - name: Run FDIC U.S. bank Call Report pipeline (4,204 banks)
        run: python data/banks/analyze_fdic_banks.py --export-csv fdic-banks-2021-2025.csv.gz

      - name: Run EIA Form 861 U.S. electric utility pipeline (1,390 utilities)
        run: python data/utilities/analyze_eia_utilities.py

      - name: Run OSHA 300A + Severe Injury pipeline (377,415 workplaces)
        run: python data/workplace-safety/analyze_osha_safety.py

      - name: Run NHTSA Recalls + Complaints pipeline (4,056 models, 36 brands)
        run: python data/auto-safety/analyze_nhtsa_safety.py

      - name: Run Dept. of Education College Scorecard pipeline (6,232 colleges)
        run: python data/colleges/analyze_college_scorecard.py

      - name: Run NOAA 11-year Storm Events pipeline (3,259 U.S. counties)
        run: python data/weather-risk/analyze_noaa_storms.py

      - name: Run U.S. Census F-33 School District Finances pipeline (13,251 districts)
        run: python data/school-finances/analyze_school_finances.py

      - name: Run USACE National Inventory of Dams pipeline (62,569 dams)
        run: python data/dams/analyze_nid_dams.py

      - name: Validate generated JS and JSON artifacts
        run: |
          node --check data/nursing-homes/summary-data.js
          node --check data/hospitals/summary-data.js
          node --check data/dialysis/summary-data.js
          node --check data/banks/summary-data.js
          node --check data/utilities/summary-data.js
          node --check data/workplace-safety/summary-data.js
          node --check data/auto-safety/summary-data.js
          node --check data/colleges/summary-data.js
          node --check data/weather-risk/summary-data.js
          node --check data/school-finances/summary-data.js
          node --check data/dams/summary-data.js
          python -c "import json; f=json.load(open('data/nursing-homes/facilities.json')); h=json.load(open('data/hospitals/hospitals.json')); d=json.load(open('data/dialysis/clinics.json')); b=json.load(open('data/banks/banks.json')); u=json.load(open('data/utilities/utilities.json')); o=json.load(open('data/workplace-safety/employers.json')); a=json.load(open('data/auto-safety/models.json')); c=json.load(open('data/colleges/colleges.json')); w=json.load(open('data/weather-risk/counties.json')); s=json.load(open('data/school-finances/districts.json')); dm=json.load(open('data/dams/high-hazard-dams.json')); assert len(f['rows']) >= 14000 and len(h['rows']) >= 5000 and len(d['rows']) >= 7000 and len(b['rows']) >= 4000 and len(u['rows']) >= 1300 and len(o['rows']) >= 5000 and len(a['rows']) >= 3500 and len(c['rows']) >= 6000 and len(w['rows']) >= 3000 and len(s['rows']) >= 13000 and len(dm['rows']) >= 13000; print('Verified all 11 flagships:', len(dm['rows']), 'high-hazard dams')"

      - name: Commit and push if federal data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nursing-homes/ data/hospitals/ data/dialysis/ data/banks/ data/utilities/ data/workplace-safety/ data/auto-safety/ data/colleges/ data/weather-risk/ data/school-finances/ data/dams/
          if git diff --cached --quiet; then
            echo "No federal data changes detected."
          else
            DATE_STR=$(date -u +%Y-%m-%d)
            git commit -m "chore(data): monthly federal flagship data refresh ($DATE_STR)"
            git push
          fi
